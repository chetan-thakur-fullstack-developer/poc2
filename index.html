<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Executive Wealth — Financial Operating System</title>
<style>
/* ============================================================
   EXECUTIVE WEALTH — DESIGN SYSTEM
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070C18; --bg-2:#0B1222; --panel:#0F1729; --panel-2:#141E33; --panel-3:#1A2740;
  --line:#1E2A44; --line-2:#26344F;
  --txt:#E8EFF9; --txt-2:#B7C4D9; --muted:#7C8CA8; --dim:#5A6A85;
  --accent:#10B981; --accent-d:#059669;
  --blue:#3B82F6; --violet:#8B5CF6; --amber:#F59E0B; --red:#EF4444; --cyan:#22D3EE; --pink:#EC4899;
  --r:14px; --r-sm:9px;
  --shadow:0 8px 32px rgba(0,0,0,.45);
  --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--txt); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#22304C;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#2E3F60;background-clip:content-box}

/* ---------- APP SHELL ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:248px;flex-shrink:0;background:linear-gradient(180deg,#0A1120,#080D18);
  border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#0EA5A5);
  display:grid;place-items:center;font-weight:800;font-size:14px;color:#04140E;
  box-shadow:0 4px 16px rgba(16,185,129,.35);
}
.brand-name{font-size:14px;font-weight:700;letter-spacing:-.2px}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:600}

nav{flex:1;overflow-y:auto;overflow-x:hidden;padding-right:2px}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
  font-weight:700;padding:14px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8.5px 10px;border-radius:9px;
  color:var(--txt-2);cursor:pointer;font-size:13px;font-weight:500;transition:.15s;
  position:relative;user-select:none;margin-bottom:1px;
}
.nav-item:hover{background:var(--panel-2);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(16,185,129,.16),rgba(16,185,129,.03));color:#fff;font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:7px;bottom:7px;width:3px;
  background:var(--accent);border-radius:0 3px 3px 0}
.nav-item .ic{opacity:.85;flex-shrink:0}
.nav-item.active .ic{color:var(--accent);opacity:1}
.nav-badge{margin-left:auto;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:20px;
  background:rgba(239,68,68,.18);color:#FCA5A5;letter-spacing:.3px}
.nav-badge.g{background:rgba(16,185,129,.18);color:#6EE7B7}

.tier-card{background:linear-gradient(140deg,#152146,#0E1830);border:1px solid var(--line-2);
  border-radius:12px;padding:12px;margin-top:12px}
.tier-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.tier-name{font-size:15px;font-weight:700;margin:2px 0 8px;color:#fff}
.tier-bar{height:5px;border-radius:4px;background:#0A1224;overflow:hidden}
.tier-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--cyan))}
.tier-note{font-size:10.5px;color:var(--muted);margin-top:7px}

/* ---------- MAIN ---------- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:62px;flex-shrink:0;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 22px;
  background:rgba(11,18,34,.85);backdrop-filter:blur(10px);z-index:20;
}
.page-title{font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.page-sub{font-size:11.5px;color:var(--muted)}
.topbar-spacer{flex:1}
.search-wrap{position:relative}
.search{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;width:250px;transition:.2s;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.12);width:290px}
.search input{background:none;border:none;outline:none;color:var(--txt);font-size:13px;width:100%;font-family:inherit}
.search input::placeholder{color:var(--dim)}
.search kbd{font-size:10px;background:var(--panel-3);border:1px solid var(--line-2);border-radius:5px;
  padding:1px 5px;color:var(--muted);font-family:inherit}
.search-results{
  position:absolute;top:46px;left:0;right:0;background:var(--panel-2);border:1px solid var(--line-2);
  border-radius:11px;box-shadow:var(--shadow);overflow:hidden;display:none;z-index:60;
}
.search-results.show{display:block}
.sr-item{padding:9px 12px;cursor:pointer;font-size:13px;display:flex;gap:9px;align-items:center;color:var(--txt-2)}
.sr-item:hover{background:var(--panel-3);color:#fff}

.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  color:var(--txt-2);display:grid;place-items:center;cursor:pointer;transition:.15s;position:relative;
}
.icon-btn:hover{background:var(--panel-3);color:#fff;border-color:var(--line-2)}
.dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--red);border:2px solid var(--panel)}
.avatar{
  width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--blue));
  display:grid;place-items:center;font-weight:700;font-size:12.5px;cursor:pointer;color:#fff;
  border:2px solid rgba(255,255,255,.1);
}
.content{flex:1;overflow-y:auto;padding:22px;scroll-behavior:smooth}
.view{animation:fadeUp .32s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- CARDS ---------- */
.card{
  background:linear-gradient(160deg,var(--panel),#0D1526);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:border-color .2s,transform .2s;
}
.card:hover{border-color:var(--line-2)}
.card-hd{padding:15px 17px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-hd h3{font-size:13.5px;font-weight:650;letter-spacing:-.1px;display:flex;align-items:center;gap:8px}
.card-hd .sub{font-size:11.5px;color:var(--muted);font-weight:400}
.card-bd{padding:15px 17px 17px}
.card-tools{margin-left:auto;display:flex;gap:7px;align-items:center}
.fr{font-size:9px;font-weight:700;letter-spacing:.4px;color:var(--dim);
  border:1px solid var(--line-2);border-radius:5px;padding:1.5px 5px;background:#0A1120;white-space:nowrap}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:1.65fr 1fr}
.g12{grid-template-columns:1fr 1.65fr}
.mt{margin-top:16px}
@media(max-width:1400px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1180px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpi{
  background:linear-gradient(155deg,var(--panel),#0C1424);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 17px;position:relative;overflow:hidden;transition:.2s;
}
.kpi:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.kpi::after{content:'';position:absolute;inset:0;background:radial-gradient(120px 60px at 100% 0%,var(--glow,rgba(16,185,129,.14)),transparent 70%);pointer-events:none}
.kpi-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  display:flex;align-items:center;gap:6px}
.kpi-val{font-size:27px;font-weight:750;letter-spacing:-1px;margin:7px 0 3px;font-variant-numeric:tabular-nums}
.kpi-meta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pill{font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:20px;letter-spacing:.2px}
.pill.up{background:rgba(16,185,129,.15);color:#34D399}
.pill.down{background:rgba(239,68,68,.15);color:#F87171}
.pill.warn{background:rgba(245,158,11,.15);color:#FBBF24}
.pill.info{background:rgba(59,130,246,.15);color:#60A5FA}
.pill.neutral{background:rgba(124,140,168,.15);color:#A3B3CC}

/* ---------- TABLES ---------- */
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
  font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:10px;border-bottom:1px solid rgba(30,42,68,.55);color:var(--txt-2);vertical-align:middle}
tbody tr{transition:.13s}
tbody tr:hover{background:rgba(30,42,68,.4)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.t-strong{color:var(--txt);font-weight:600}
.t-muted{color:var(--muted);font-size:11.5px}

/* ---------- BARS ---------- */
.bar{height:7px;border-radius:5px;background:#0A1224;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.bar.sm{height:5px}
.bar.lg{height:10px}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;
  font-size:12.8px;font-weight:600;cursor:pointer;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--txt);transition:.16s;font-family:inherit;white-space:nowrap;
}
.btn:hover{background:var(--panel-3);border-color:#31415F;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#04140E;
  box-shadow:0 4px 14px rgba(16,185,129,.25)}
.btn.primary:hover{box-shadow:0 6px 20px rgba(16,185,129,.38);filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:5.5px 10px;font-size:11.8px;border-radius:7px}
.btn.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#FCA5A5}
.btn.danger:hover{background:rgba(239,68,68,.2)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important}

/* ---------- SEGMENTED ---------- */
.seg{display:inline-flex;background:#0A1224;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{
  border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:6px 12px;
  border-radius:6px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap;
}
.seg button:hover{color:var(--txt-2)}
.seg button.on{background:var(--panel-3);color:#fff;box-shadow:var(--shadow-sm)}
.seg button.on.accent{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#04140E}

/* ---------- INPUTS ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:#0A1224;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--txt);
  font-size:13px;font-family:inherit;outline:none;transition:.16s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.12)}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:6px;background:#0A1224;border-radius:5px;outline:none;width:100%;
  border:1px solid var(--line);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-d));cursor:pointer;
  box-shadow:0 2px 8px rgba(16,185,129,.5);border:2px solid #0A1224;
}
.switch{position:relative;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#1C2942;border-radius:20px;cursor:pointer;transition:.22s}
.slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#7C8CA8;
  border-radius:50%;transition:.22s}
.switch input:checked + .slider{background:rgba(16,185,129,.35)}
.switch input:checked + .slider:before{transform:translateX(18px);background:var(--accent)}

/* ---------- MISC ---------- */
.chart{display:block;width:100%}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
  border-bottom:1px solid rgba(30,42,68,.5);font-size:12.8px}
.stat-row:last-child{border-bottom:none}
.stat-row .l{color:var(--muted);display:flex;align-items:center;gap:8px}
.stat-row .v{font-weight:650;font-variant-numeric:tabular-nums;color:var(--txt)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-size:11.5px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);
  color:var(--txt-2);cursor:pointer;transition:.15s}
.chip:hover{background:var(--panel-3);color:#fff}
.chip.on{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:#34D399}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
  padding:3px 8px;border-radius:6px;letter-spacing:.2px}
.badge.ok{background:rgba(16,185,129,.14);color:#34D399}
.badge.warn{background:rgba(245,158,11,.14);color:#FBBF24}
.badge.bad{background:rgba(239,68,68,.14);color:#F87171}
.badge.info{background:rgba(59,130,246,.14);color:#60A5FA}
.badge.violet{background:rgba(139,92,246,.14);color:#A78BFA}
.badge.grey{background:rgba(124,140,168,.14);color:#A3B3CC}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---------- CALENDAR ---------- */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-head div{text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);font-weight:700;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{
  min-height:62px;border-radius:9px;padding:6px 7px;border:1px solid var(--line);
  background:#0B1322;position:relative;transition:.15s;cursor:default;
}
.cal-cell:hover{border-color:var(--line-2);transform:translateY(-1px)}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-cell.pos{background:linear-gradient(160deg,rgba(16,185,129,.11),rgba(16,185,129,.03));border-color:rgba(16,185,129,.28)}
.cal-cell.tight{background:linear-gradient(160deg,rgba(245,158,11,.13),rgba(245,158,11,.03));border-color:rgba(245,158,11,.32)}
.cal-cell.neg{background:linear-gradient(160deg,rgba(239,68,68,.15),rgba(239,68,68,.04));border-color:rgba(239,68,68,.38)}
.cal-d{font-size:10.5px;color:var(--muted);font-weight:700}
.cal-b{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.cal-b.pos{color:#34D399}.cal-b.tight{color:#FBBF24}.cal-b.neg{color:#F87171}
.cal-ev{font-size:9.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-today{outline:2px solid var(--blue);outline-offset:-2px}

/* ---------- GOAL CARDS ---------- */
.goal-card{background:linear-gradient(160deg,var(--panel),#0C1424);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;transition:.2s;position:relative;overflow:hidden}
.goal-card:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.goal-top{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
.goal-ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.goal-name{font-size:14px;font-weight:650;letter-spacing:-.1px}
.goal-cat{font-size:11px;color:var(--muted)}
.ring{position:relative;width:56px;height:56px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:750}

/* ---------- CHAT ---------- */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:440px}
.chat-body{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:11px;max-width:82%;animation:fadeUp .28s ease}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg-av{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:700}
.msg.ai .msg-av{background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff}
.msg.me .msg-av{background:var(--panel-3);color:var(--txt-2);border:1px solid var(--line-2)}
.bubble{padding:11px 14px;border-radius:13px;font-size:13.3px;line-height:1.6}
.msg.ai .bubble{background:var(--panel-2);border:1px solid var(--line);border-top-left-radius:4px;color:var(--txt-2)}
.msg.me .bubble{background:linear-gradient(135deg,rgba(59,130,246,.22),rgba(59,130,246,.1));
  border:1px solid rgba(59,130,246,.3);border-top-right-radius:4px;color:var(--txt)}
.src{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.src b{color:var(--txt-2);font-weight:650}
.src-item{display:inline-flex;align-items:center;gap:5px;background:#0A1224;border:1px solid var(--line);
  border-radius:6px;padding:2.5px 7px;margin:4px 4px 0 0;font-size:10.5px;color:var(--txt-2)}
.disc{margin-top:8px;font-size:10.5px;color:var(--dim);font-style:italic}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;
  animation:blink 1.3s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(4,8,16,.72);backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:200;opacity:0;transition:.22s;padding:20px}
.modal-bg.in{opacity:1}
.modal{background:linear-gradient(160deg,#131D33,#0D1526);border:1px solid var(--line-2);
  border-radius:16px;width:100%;max-width:600px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.65);transform:scale(.96) translateY(8px);transition:.22s}
.modal-bg.in .modal{transform:none}
.modal-hd{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-hd h3{font-size:15px;font-weight:700;flex:1}
.modal-bd{padding:20px;overflow-y:auto}

/* ---------- TOAST ---------- */
#toast-root{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{
  display:flex;align-items:center;gap:10px;background:linear-gradient(140deg,#16223A,#101A2E);
  border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:11px;
  padding:12px 16px;font-size:13px;box-shadow:var(--shadow);animation:slideIn .3s cubic-bezier(.22,1,.36,1);
  max-width:400px;
}
.toast.warn{border-left-color:var(--amber)}
.toast.bad{border-left-color:var(--red)}
.toast.out{animation:slideOut .3s forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}

/* ---------- CONFETTI ---------- */
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:400}

/* ---------- DROPDOWN PANEL ---------- */

/* ------------------------------ 5. CHART ENGINE --------------------------- */
const chartRegistry = new Map();

function chart(id, drawFn, h) {
  chartRegistry.set(id, { fn: drawFn, h: h || 220 });
  requestAnimationFrame(() => requestAnimationFrame(() => paintChart(id)));
}
function paintChart(id) {
  const c = document.getElementById(id);
  const entry = chartRegistry.get(id);
  if (!c || !entry) return;
  const parent = c.parentElement;
  const w = Math.max(180, parent.clientWidth);
  const h = entry.h;
  const dpr = window.devicePixelRatio || 1;
  c.width = w * dpr; c.height = h * dpr;
  c.style.width = w + 'px'; c.style.height = h + 'px';
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  try { entry.fn(ctx, w, h); } catch (e) { console.warn('chart error', id, e); }
}
window.addEventListener('resize', () => chartRegistry.forEach((_, id) => paintChart(id)));

function niceScale(min, max, ticks = 4) {
  if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
  if (min === max) { max = min + 1; }
  const range = max - min;
  const step0 = range / ticks;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  let step;
  if (norm <= 1) step = 1; else if (norm <= 2) step = 2; else if (norm <= 2.5) step = 2.5;
  else if (norm <= 5) step = 5; else step = 10;
  step *= mag;
  return { min: Math.floor(min / step) * step, max: Math.ceil(max / step) * step, step };
}

function drawLine(ctx, w, h, cfg) {
  const pad = { l: 60, r: 16, t: 16, b: 30 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  if (iw <= 0 || ih <= 0) return;
  const vals = cfg.series.flatMap(s => s.values).filter(v => isFinite(v));
  if (cfg.buffer != null) vals.push(cfg.buffer);
  if (cfg.zeroLine) vals.push(0);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  const sc = niceScale(mn, mx, cfg.ticks || 4);
  mn = sc.min; mx = sc.max;

  const n = cfg.labels.length;
  const X = i => pad.l + (n <= 1 ? iw / 2 : i * iw / (n - 1));
  const Y = v => pad.t + ih - ((v - mn) / (mx - mn)) * ih;

  // grid + y labels
  ctx.font = '11px Inter, system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  for (let v = mn; v <= mx + 1e-9; v += sc.step) {
    const y = Y(v);
    ctx.strokeStyle = 'rgba(30,42,68,.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#7C8CA8'; ctx.textAlign = 'right';
    ctx.fillText(cfg.fmtY ? cfg.fmtY(v) : moneyK(v), pad.l - 9, y);
  }

  // buffer / threshold
  if (cfg.buffer != null && cfg.buffer >= mn && cfg.buffer <= mx) {
    const y = Y(cfg.buffer);
    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = '#F59E0B'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#FBBF24'; ctx.font = '10px Inter, system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.fillText('Safety buffer', pad.l + 6, y - 9);
  }

  // x labels
  ctx.fillStyle = '#7C8CA8'; ctx.textAlign = 'center'; ctx.font = '10.5px Inter, system-ui, sans-serif';
  const stepX = Math.max(1, Math.ceil(n / 9));
  cfg.labels.forEach((l, i) => {
    if (i % stepX === 0 || i === n - 1) {
      const x = clamp(X(i), pad.l + 12, w - pad.r - 12);
      ctx.fillText(l, x, h - 12);
    }
  });

  // series
  cfg.series.forEach(s => {
    if (s.fill) {
      const g = ctx.createLinearGradient(0, pad.t, 0, pad.t + ih);
      g.addColorStop(0, hexA(s.color, 0.3));
      g.addColorStop(1, hexA(s.color, 0));
      ctx.beginPath();
      ctx.moveTo(X(0), Y(s.values[0]));
      s.values.forEach((v, i) => ctx.lineTo(X(i), Y(v)));
      ctx.lineTo(X(s.values.length - 1), pad.t + ih);
      ctx.lineTo(X(0), pad.t + ih);
      ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
    }
    ctx.beginPath();
    ctx.lineWidth = s.width || 2.3;
    ctx.strokeStyle = s.color;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (s.dash) ctx.setLineDash(s.dash); else ctx.setLineDash([]);
    s.values.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
    ctx.stroke();
    ctx.setLineDash([]);
    if (s.dots) {
      s.values.forEach((v, i) => {
        ctx.beginPath(); ctx.arc(X(i), Y(v), 3, 0, 7);
        ctx.fillStyle = s.color; ctx.fill();
        ctx.strokeStyle = '#0F1729'; ctx.lineWidth = 1.6; ctx.stroke();
      });
    }
    if (s.lastDot) {
      const i = s.values.length - 1;
      ctx.beginPath(); ctx.arc(X(i), Y(s.values[i]), 4.5, 0, 7);
      ctx.fillStyle = s.color; ctx.fill();
      ctx.strokeStyle = '#0F1729'; ctx.lineWidth = 2; ctx.stroke();
    }
  });
}

function drawBars(ctx, w, h, cfg) {
  const pad = { l: 58, r: 16, t: 16, b: 30 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const all = cfg.series.flatMap(s => s.values);
  const sc = niceScale(Math.min(0, ...all), Math.max(...all), 4);
  const mn = sc.min, mx = sc.max;
  const Y = v => pad.t + ih - ((v - mn) / (mx - mn)) * ih;

  ctx.font = '11px Inter, system-ui, sans-serif'; ctx.textBaseline = 'middle';
  for (let v = mn; v <= mx + 1e-9; v += sc.step) {
    const y = Y(v);
    ctx.strokeStyle = 'rgba(30,42,68,.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#7C8CA8'; ctx.textAlign = 'right';
    ctx.fillText(moneyK(v), pad.l - 9, y);
  }
  const n = cfg.labels.length;
  const groupW = iw / n;
  const barW = Math.min(20, (groupW - 8) / cfg.series.length);
  cfg.labels.forEach((l, i) => {
    const cx = pad.l + groupW * i + groupW / 2;
    cfg.series.forEach((s, si) => {
      const v = s.values[i];
      const x = cx - (cfg.series.length * barW) / 2 + si * barW + 1;
      const y0 = Y(0), y1 = Y(v);
      const top = Math.min(y0, y1), hgt = Math.max(2, Math.abs(y1 - y0));
      const g = ctx.createLinearGradient(0, top, 0, top + hgt);
      g.addColorStop(0, s.color); g.addColorStop(1, hexA(s.color, 0.5));
      ctx.fillStyle = g;
      ctx.beginPath();
      const r = Math.min(3, barW / 2);
      ctx.moveTo(x, top + hgt);
      ctx.lineTo(x, top + r);
      ctx.quadraticCurveTo(x, top, x + r, top);
      ctx.lineTo(x + barW - 2 - r, top);
      ctx.quadraticCurveTo(x + barW - 2, top, x + barW - 2, top + r);
      ctx.lineTo(x + barW - 2, top + hgt);
      ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle = '#7C8CA8'; ctx.textAlign = 'center'; ctx.font = '10.5px Inter, system-ui, sans-serif';
    ctx.fillText(l, cx, h - 12);
  });
}

function drawDonut(ctx, w, h, segs, center, sub) {
  const cx = w / 2, cy = h / 2;
  const r = Math.min(w, h) / 2 - 8;
  const ir = r * 0.63;
  const total = segs.reduce((s, x) => s + x.value, 0) || 1;
  let a = -Math.PI / 2;
  segs.forEach(s => {
    const ang = (s.value / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, a, a + ang);
    ctx.arc(cx, cy, ir, a + ang, a, true);
    ctx.closePath();
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.strokeStyle = '#0F1729'; ctx.lineWidth = 2; ctx.stroke();
    a += ang;
  });
  if (center) {
    ctx.fillStyle = '#E8EFF9';
    ctx.font = '700 20px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(center, cx, cy - (sub ? 8 : 0));
  }
  if (sub) {
    ctx.fillStyle = '#7C8CA8';
    ctx.font = '10.5px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(sub, cx, cy + 12);
  }
}

function drawGauge(ctx, w, h, value, max, color, label) {
  const cx = w / 2, cy = h * 0.82;
  const r = Math.min(w / 2, h * 0.78) - 14;
  const start = Math.PI, end = 2 * Math.PI;
  ctx.lineCap = 'round';
  ctx.lineWidth = 13;
  ctx.strokeStyle = '#16223A';
  ctx.beginPath(); ctx.arc(cx, cy, r, start, end); ctx.stroke();
  const frac = clamp(value / max, 0, 1);
  const g = ctx.createLinearGradient(cx - r, 0, cx + r, 0);
  g.addColorStop(0, hexA(color, 0.55)); g.addColorStop(1, color);
  ctx.strokeStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r, start, start + Math.PI * frac); ctx.stroke();
  ctx.fillStyle = '#E8EFF9';
  ctx.font = '700 32px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(String(value), cx, cy - 4);
  ctx.fillStyle = '#7C8CA8';
  ctx.font = '11px Inter, system-ui, sans-serif';
  ctx.fillText(label, cx, cy + 16);
}

function confetti() {
  const c = document.createElement('canvas');

  const cols = ['#10B981', '#3B82F6', '#F59E0B', '#8B5CF6', '#EF4444', '#22D3EE', '#EC4899'];
  const parts = Array.from({ length: 150 }, () => ({

    col: cols[(Math.random() * cols.length) | 0],
  }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62);
      ctx.restore();
    });
    if (++f < 210) requestAnimationFrame(loop); else c.remove();
  })();
}

/* ------------------------------ 7. DEBT ENGINE ---------------------------- */
function simulateDebts(debts, extra, strategy, maxMonths = 600) {
  const ds = debts.map(d => ({ id: d.id, name: d.name, balance: d.balance, apr: d.apr, min: d.min, color: d.color, paidOffMonth: null }));
  if (!ds.length) return { months: 0, totalInterest: 0, schedule: [], debts: ds, totalPaid: 0 };
  const baseTotal = ds.reduce((s, d) => s + d.min, 0) + extra;

  let month = 0, totalInterest = 0, totalPaid = 0;
  const schedule = [];

  while (ds.some(d => d.balance > 0.01) && month < maxMonths) {
    month++;
    // 1. accrue interest
    let mInterest = 0;
    ds.forEach(d => {
      if (d.balance > 0.01) {
        const i = d.balance * (d.apr / 100 / 12);
        d.balance += i; mInterest += i;
      }
    });
    totalInterest += mInterest;
    const startBal = ds.reduce((s, d) => s + Math.max(0, d.balance), 0);

    // 2. pay minimums on all active debts
    let budget = baseTotal;
    ds.forEach(d => {
      if (d.balance <= 0.01) return;
      const p = Math.min(d.min, d.balance, budget);
      d.balance -= p; budget -= p; totalPaid += p;
    });

    // 3. cascade remaining (freed minimums + extra) by priority
    const order = ds.filter(d => d.balance > 0.01)
      .sort((a, b) => strategy === 'snowball' ? a.balance - b.balance : b.apr - a.apr);
    for (const d of order) {
      if (budget <= 0.005) break;
      const p = Math.min(budget, d.balance);
      d.balance -= p; budget -= p; totalPaid += p;
    }

    // 4. cleanup + record
    ds.forEach(d => {
      if (d.balance <= 0.01 && d.paidOffMonth === null) { d.balance = 0; d.paidOffMonth = month; }
      else if (d.balance < 0.01) d.balance = 0;
    });

    const endBal = ds.reduce((s, d) => s + d.balance, 0);
    schedule.push({
      month, interest: mInterest, startBalance: startBal, endBalance: endBal,
      principal: Math.max(0, startBal - endBal - mInterest),
      balances: ds.map(d => ({ name: d.name, balance: d.balance })),
    });
  }

  return { months: month, totalInterest, schedule, debts: ds, totalPaid, baseTotal };
}

function debtFreeDate(months) {
  const d = addMonths(TODAY, months);
  return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

/* ------------------------------ 8. CASH FLOW ENGINE ----------------------- */
const SAFETY_BUFFER = 2500;

function buildForecast(days, sc) {
  sc = sc || { purchase: 0, purchaseDay: 12, incomeDelta: 0, newRecurring: 0, windfall: 0, windfallDay: 20 };
  const out = [];
  let bal = DB.accounts.checking;

  // one-time estimated tax payment: 15th of current month if future, else next month
  const taxDay = (() => {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth(), 15);
    return d >= TODAY ? d : new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 15);
  })();

  for (let i = 0; i < days; i++) {
    const d = addDays(TODAY, i);
    const dom = d.getDate();
    const events = [];

    DB.recurring.forEach(r => {
      if (r.dom === dom) {
        let amt = r.amount;
        if (r.type === 'income') amt = amt * (1 + (sc.incomeDelta || 0) / 100);
        events.push({ name: r.name, amount: amt, cat: r.cat, type: r.type });
      }
    });

    if (sc.newRecurring > 0 && dom === 1) {
      events.push({ name: 'New recurring expense', amount: -sc.newRecurring, cat: 'New', type: 'bill' });
    }
    if (d.getTime() === taxDay.getTime()) {
      events.push({ name: 'Q3 Estimated Tax Payment', amount: -12000, cat: 'Taxes', type: 'bill' });
    }
    if (sc.purchase > 0 && i === sc.purchaseDay) {
      events.push({ name: 'Planned large purchase', amount: -sc.purchase, cat: 'Purchase', type: 'bill' });
    }
    if (sc.windfall > 0 && i === sc.windfallDay) {
      events.push({ name: 'One-time windfall', amount: sc.windfall, cat: 'Income', type: 'income' });
    }

    bal += events.reduce((s, e) => s + e.amount, 0);
    out.push({ date: d, balance: bal, events });
  }
  return out;
}

/* ------------------------------ 9. GOAL ENGINE ---------------------------- */
function goalRequiredMonthly(g) {
  const months = Math.max(1, monthsUntil(g.date));
  return Math.max(0, (g.target - g.saved) / months);
}
function goalProjectedDate(g) {
  const remaining = Math.max(0, g.target - g.saved);
  if (g.monthly <= 0) return null;
  const months = Math.ceil(remaining / g.monthly);
  return addMonths(TODAY, months);
}
function goalPacing(g) {
  const req = goalRequiredMonthly(g);
  if (g.saved >= g.target) return { label: 'Complete', cls: 'ok', color: '#10B981' };
  if (g.monthly >= req * 1.05) return { label: 'Ahead', cls: 'ok', color: '#10B981' };
  if (g.monthly >= req * 0.95) return { label: 'On Track', cls: 'info', color: '#3B82F6' };
  return { label: 'Behind', cls: 'warn', color: '#F59E0B' };
}

      $('#evBody').innerHTML = rows.map(r => `

        </tr>`).join('') || '<tr><td colspan="5" class="empty">No events in range</td></tr>';
    };
    renderEvents();

    const refresh = () => {
      fc = buildForecast(state.forecastDays, state.scenario);
      renderChart(); renderCalendar(); renderEvents();
    };

    $('#rangeSeg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      state.forecastDays = +b.dataset.d;
      $$('#rangeSeg button').forEach(x => x.classList.toggle('on', x === b));
      $$('#rangeSeg button').forEach(x => x.classList.toggle('accent', x === b));

    $('#scApply').addEventListener('click', () => {
      state.scenario.purchase = +$('#scPurchase').value || 0;

      state.scenario.incomeDelta = +$('#scIncome').value || 0;
      state.scenario.newRecurring = +$('#scNewRec').value || 0;
      state.scenario.windfall = +$('#scWindfall').value || 0;
      refresh();
      const minB = Math.min(...buildForecast(state.forecastDays, state.scenario).map(f => f.balance));
      const negDay = buildForecast(state.forecastDays, state.scenario).find(f => f.balance < 0);
      $('#scResult').innerHTML = `
        <div style="background:#0A1224;border:1px solid var(--line);border-radius:10px;padding:12px">

            <div class="v" style="color:${minB < 0 ? '#F87171' : '#34D399'}">${money(minB)}</div></div>
          <div class="stat-row"><div class="l">First negative date</div>
            <div class="v">${negDay ? fmtDateFull(negDay.date) : '—'}</div></div>

            <div class="v">${buildForecast(state.forecastDays, state.scenario).filter(f => f.balance < SAFETY_BUFFER).length} days</div></div>
        </div>`;
      toast('Scenario applied — forecast recalculated', 'ok');
    });

    $('#scReset').addEventListener('click', () => {
      state.scenario = { purchase: 0, purchaseDay: 12, incomeDelta: 0, newRecurring: 0, windfall: 0, windfallDay: 20 };
      ['scPurchase', 'scIncome', 'scNewRec', 'scWindfall'].forEach(id => $('#' + id).value = 0);
      $('#scPurchaseDay').value = 12;
      $('#scResult').innerHTML = '';
      refresh();
      toast('Scenario reset to baseline');
    });
  },
};

          <div class="field"><label>APR %</label><input type="number" id="ndApr" placeholder="19.99" step="0.01"/></div>
          <div class="field"><label>Minimum payment</label><input type="number" id="ndMin" placeholder="150"/></div>
          <div class="field"><label>Type</label>
            <select id="ndType"><option>Credit card</option><option>Auto</option><option>Student</option><option>Personal</option><option>Medical</option></select></div>
        </div>
        <div style="display:flex;gap:9px;margin-top:20px;justify-content:flex-end">
          <button class="btn ghost" onclick="closeModal()">Cancel</button>
          <button class="btn primary" id="ndSave">Add liability</button>
        </div>`, root => {
        root.querySelector('#ndSave').addEventListener('click', () => {
          const name = $('#ndName').value.trim();
          const bal = +$('#ndBal').value;
          const apr = +$('#ndApr').value;
          const min = +$('#ndMin').value;
          if (!name || !bal || !min) { toast('Please fill in name, balance and minimum', 'warn'); return; }
          const colors = ['#EF4444', '#F59E0B', '#8B5CF6', '#EC4899', '#22D3EE'];
          DB.debts.push({ id: uid(), name, type: $('#ndType').value, balance: bal, apr: apr || 0, min, color: colors[DB.debts.length % colors.length], startBalance: bal });
          closeModal();
          go('debt');
          toast(`"${name}" added — payoff plan recalculated`);
        });
      });
    });

    $('#loanCalc').addEventListener('click', () => {
      const amt = +$('#loanAmt').value || 0;
      const apr = +$('#loanApr').value || 0;
      const term = +$('#loanTerm').value || 12;
      const type = $('#loanType').value;
      const monthlyPmt = apr === 0 ? amt / term : (amt * (apr / 100 / 12)) / (1 - Math.pow(1 + (apr / 100 / 12), -term));
      const totalInterest = monthlyPmt * term - amt;

      // Scenario: add the loan to the debt stack
      const withLoan = simulateDebts([...DB.debts, { id: 'new', name: type + ' loan', balance: amt, apr, min: monthlyPmt, color: '#22D3EE' }], state.extra, 'avalanche');
      const without = simulateDebts(DB.debts, state.extra, 'avalanche');
      const newDebtFree = debtFreeDate(withLoan.months);
      const monthDelta = withLoan.months - without.months;

      $('#loanResult').innerHTML = `
        <div class="grid g3">
          <div style="background:#0A1224;border:1px solid var(--line);border-radius:11px;padding:14px">
            <div style="font-size:10.5px;color:var(--muted);letter-spacing:.5px">ESTIMATED MONTHLY PAYMENT</div>
            <div style="font-size:21px;font-weight:750;margin-top:4px">${money(monthlyPmt, 2)}</div>
          </div>
          <div style="background:#0A1224;border:1px solid var(--line);border-radius:11px;padding:14px">
            <div style="font-size:10.5px;color:var(--muted);letter-spacing:.5px">TOTAL INTEREST (LOAN ONLY)</div>
            <div style="font-size:21px;font-weight:750;color:#F87171;margin-top:4px">${money(totalInterest, 2)}</div>
          </div>
          <div style="background:#0A1224;border:1px solid rgba(245,158,11,.35);border-radius:11px;padding:14px">
            <div style="font-size:10.5px;color:var(--muted);letter-spacing:.5px">IMPACT ON DEBT-FREE DATE</div>
            <div style="font-size:21px;font-weight:750;color:#FBBF24;margin-top:4px">+${monthDelta} mo</div>
            <div style="font-size:11px;color:var(--muted)">Now ${newDebtFree}</div>
          </div>
        </div>
        <div style="margin-top:12px;padding:12px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:10px;font-size:12.3px;color:var(--txt-2)">
          Taking on this ${type.toLowerCase()} loan would push your combined debt-free date from
          <b>${debtFreeDate(without.months)}</b> to <b>${newDebtFree}</b> and add
          <b style="color:#F87171">${money(totalInterest, 2)}</b> in interest over the term.
          ${monthDelta > 24 ? 'Consider a shorter term or larger down payment.' : 'This fits within your current payoff capacity.'}
        </div>`;
      toast('Loan scenario modelled');
    });
  },
};

/* ============================ 10.4 BUDGET ================================= */
VIEWS.budget = {
  title: 'Budgeting',
  sub: 'Category, Flex, Zero-Based and Adaptive budgeting methods',
  render() {
    const totalB = DB.budget.reduce((s, b) => s + b.budgeted, 0);
    const totalS = DB.budget.reduce((s, b) => s + b.spent, 0);
    return `
    <div class="view">
      <div class="card" style="margin-bottom:16px">
        <div class="card-bd" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <div class="seg" id="methodSeg">
            <button data-m="category" class="${state.budgetMethod === 'category' ? 'on accent' : ''}">Category</button>
            <button data-m="flex" class="${state.budgetMethod === 'flex' ? 'on accent' : ''}">Flex</button>
            <button data-m="zero" class="${state.budgetMethod === 'zero' ? 'on accent' : ''}">Zero-Based</button>
            <button data-m="adaptive" class="${state.budgetMethod === 'adaptive' ? 'on accent' : ''}">Adaptive</button>
          </div>
          <div style="flex:1"></div>
          <div style="display:flex;gap:16px">
            <div><div style="font-size:10.5px;color:var(--muted)">BUDGETED</div><div style="font-weight:700">${money(totalB)}</div></div>
            <div><div style="font-size:10.5px;color:var(--muted)">SPENT</div><div style="font-weight:700">${money(totalS)}</div></div>
            <div><div style="font-size:10.5px;color:var(--muted)">REMAINING</div><div style="font-weight:700;color:${totalB - totalS >= 0 ? '#34D399' : '#F87171'}">${money(totalB - totalS)}</div></div>
          </div>
        </div>
      </div>
      <div id="budgetBody"></div>
    </div>`;
  },
  mount() {
    const renderBody = () => {
      const body = $('#budgetBody');
      if (state.budgetMethod === 'category') body.innerHTML = renderCategoryMethod();
      else if (state.budgetMethod === 'flex') body.innerHTML = renderFlexMethod();
      else if (state.budgetMethod === 'zero') body.innerHTML = renderZeroMethod();
      else body.innerHTML = renderAdaptiveMethod();

      // wire row interactions
      $$('[data-budget-inc]').forEach(b => b.addEventListener('click', () => {
        const cat = b.dataset.budgetInc;
        const row = DB.budget.find(x => x.cat === cat);
        if (!row) return;
        row.budgeted += 50;
        renderBody();
        toast(`${cat} budget increased to ${money(row.budgeted)}`);
      }));
      $$('[data-budget-dec]').forEach(b => b.addEventListener('click', () => {
        const cat = b.dataset.budgetDec;
        const row = DB.budget.find(x => x.cat === cat);
        if (!row) return;
        row.budgeted = Math.max(0, row.budgeted - 50);
        renderBody();
      }));
      const applyBtn = $('#applyAdaptive');
      if (applyBtn) applyBtn.addEventListener('click', () => {
        DB.budget.forEach(b => { b.budgeted = Math.round(b.avg6 / 10) * 10; });
        renderBody();
        toast('Adaptive budget suggestions applied across all categories');
      });
      const autoAssign = $('#autoAssign');
      if (autoAssign) autoAssign.addEventListener('click', () => {
        const totalB = DB.budget.reduce((s, b) => s + b.budgeted, 0);
        const tbb = DB.incomeMonthly - totalB;
        if (tbb <= 0) { toast('Every dollar is already assigned', 'warn'); return; }
        DB.budget.find(b => b.cat === 'Travel').budgeted += Math.round(tbb * 0.4);
        DB.budget.find(b => b.cat === 'Annual Insurance').budgeted += Math.round(tbb * 0.3);
        DB.budget.find(b => b.cat === 'Gifts & Holidays').budgeted += Math.round(tbb * 0.3);
        renderBody();
        toast('Remaining funds auto-assigned to non-monthly categories');
      });
    };

    const renderCategoryMethod = () => {
      const rows = DB.budget.filter(b => {
        if (state.focusedView === 'under') return b.spent > b.budgeted;
        if (state.focusedView === 'over') return b.budgeted > b.avg6 + 100;
        if (state.focusedView === 'snoozed') return b.type === 'nonmonthly';
        if (state.focusedView === 'available') return b.budgeted - b.spent > 0;
        return true;
      });
      return `
      <div class="card">
        <div class="card-hd">
          <h3>Category Budgets <span class="fr">FR-BUDGET-001</span></h3>
          <div class="card-tools" style="flex-wrap:wrap">
            <span style="font-size:11px;color:var(--muted);margin-right:4px">Focused views:</span>
            <button class="chip ${state.focusedView === 'all' ? 'on' : ''}" data-focus="all">All</button>
            <button class="chip ${state.focusedView === 'under' ? 'on' : ''}" data-focus="under">Underfunded</button>
            <button class="chip ${state.focusedView === 'over' ? 'on' : ''}" data-focus="over">Overfunded</button>
            <button class="chip ${state.focusedView === 'snoozed' ? 'on' : ''}" data-focus="snoozed">Snoozed</button>
            <button class="chip ${state.focusedView === 'available' ? 'on' : ''}" data-focus="available">Money Available</button>
          </div>
        </div>
        <div class="card-bd" style="padding-top:6px;overflow-x:auto">
          <table>
            <thead><tr><th>Category</th><th>Type</th><th class="num">Budgeted</th><th class="num">Spent</th><th class="num">Remaining</th><th style="width:180px">Progress</th><th class="num">Adjust</th></tr></thead>
            <tbody>
              ${rows.map(b => {
                const p = (b.spent / b.budgeted) * 100;
                const over = b.spent > b.budgeted;
                return `<tr>
                  <td class="t-strong">${esc(b.cat)}</td>
                  <td><span class="badge ${b.type === 'fixed' ? 'grey' : b.type === 'flexible' ? 'info' : 'violet'}">${b.type}</span></td>
                  <td class="num">${money(b.budgeted)}</td>
                  <td class="num">${money(b.spent)}</td>
                  <td class="num" style="color:${over ? '#F87171' : '#34D399'};font-weight:650">${money(b.budgeted - b.spent)}</td>
                  <td>${progressBar(p, over ? '#EF4444' : p > 80 ? '#F59E0B' : '#10B981', 'sm')}
                      <div style="font-size:10px;color:var(--muted);margin-top:3px">${p.toFixed(0)}% used</div></td>
                  <td class="num" style="white-space:nowrap">
                    <button class="btn sm ghost" style="padding:3px 8px" data-budget-dec="${esc(b.cat)}">−</button>
                    <button class="btn sm ghost" style="padding:3px 8px" data-budget-inc="${esc(b.cat)}">+</button>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          ${rows.length === 0 ? '<div class="empty">No categories match this focused view 🎉</div>' : ''}
        </div>
      </div>

      <div class="card mt">
        <div class="card-hd"><h3>Sinking Funds <span class="fr">FR-BUDGET-007</span></h3>
          <span class="sub">Accumulate monthly, release when the bill is due</span></div>
        <div class="card-bd">
          <div class="grid g4">
            ${DB.sinkingFunds.map(s => {
              const p = (s.saved / s.target) * 100;
              return `<div style="background:#0A1224;border:1px solid var(--line);border-radius:11px;padding:14px">
                <div style="display:flex;justify-content:space-between;align-items:flex-start">
                  <div style="font-size:12.8px;font-weight:600;color:var(--txt)">${esc(s.name)}</div>
                  <span class="badge ${p >= 80 ? 'ok' : p >= 50 ? 'info' : 'grey'}">${p.toFixed(0)}%</span>
                </div>
                <div style="font-size:11px;color:var(--muted);margin:4px 0 9px">Due ${esc(s.due)} · ${money(s.monthly)}/mo</div>
                ${progressBar(p, 'linear-gradient(90deg,#8B5CF6,#22D3EE)')}
                <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)">
                  <span>${money(s.saved)}</span><span>${money(s.target)}</span>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>`;
    };

    const renderFlexMethod = () => {
      const fixed = DB.budget.filter(b => b.type === 'fixed');
      const flexible = DB.budget.filter(b => b.type === 'flexible');
      const nonMonthly = DB.budget.filter(b => b.type === 'nonmonthly');
      const sum = arr => ({ b: arr.reduce((s, x) => s + x.budgeted, 0), s: arr.reduce((s, x) => s + x.spent, 0) });
      const f = sum(fixed), fl = sum(flexible), nm = sum(nonMonthly);

      const bucket = (title, arr, sums, tracked, color) => `
        <div class="card">
          <div class="card-hd">
            <h3>${title}</h3>
            <div class="card-tools">${tracked ? '<span class="badge ok">Tracked</span>' : '<span class="badge grey">Untracked</span>'}</div>
          </div>
          <div class="card-bd">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
              <span style="font-size:22px;font-weight:750">${money(sums.b)}</span>
              <span style="font-size:12px;color:var(--muted)">${money(sums.s)} spent</span>
            </div>
            ${progressBar((sums.s / sums.b) * 100, color, 'lg')}
            <div style="margin-top:14px">
              ${arr.map(b => `
                <div class="stat-row">
                  <div class="l">${esc(b.cat)}</div>
                  <div class="v">${money(b.spent)} <span style="color:var(--muted);font-weight:400">/ ${money(b.budgeted)}</span></div>
                </div>`).join('')}
            </div>
          </div>
        </div>`;

      return `
      <div style="background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.25);border-radius:12px;padding:13px 16px;margin-bottom:16px;font-size:12.5px;color:var(--txt-2)">
        <b style="color:#60A5FA">Flex Budgeting</b> — Group spending into three buckets. Only the <b>Flexible</b> bucket is tracked against a limit,
        giving you freedom to shift between categories without guilt.
      </div>
      <div class="grid g3">
        ${bucket('🔒 Fixed', fixed, f, false, 'linear-gradient(90deg,#7C8CA8,#A3B3CC)')}
        ${bucket('🎯 Flexible', flexible, fl, true, fl.s > fl.b ? '#EF4444' : 'linear-gradient(90deg,#10B981,#22D3EE)')}
        ${bucket('📅 Non-Monthly', nonMonthly, nm, false, 'linear-gradient(90deg,#8B5CF6,#22D3EE)')}
      </div>
      <div class="card mt">
        <div class="card-bd" style="display:flex;gap:24px;flex-wrap:wrap">
          <div><div style="font-size:11px;color:var(--muted)">TOTAL MONTHLY PLAN</div><div style="font-size:22px;font-weight:750">${money(f.b + fl.b + nm.b)}</div></div>
          <div><div style="font-size:11px;color:var(--muted)">FLEXIBLE REMAINING</div>
            <div style="font-size:22px;font-weight:750;color:${fl.b - fl.s >= 0 ? '#34D399' : '#F87171'}">${money(fl.b - fl.s)}</div></div>
          <div><div style="font-size:11px;color:var(--muted)">FLEX UTILIZATION</div>
            <div style="font-size:22px;font-weight:750">${((fl.s / fl.b) * 100).toFixed(0)}%</div></div>
        </div>
      </div>`;
    };

    const renderZeroMethod = () => {
      const assigned = DB.budget.reduce((s, b) => s + b.budgeted, 0);
      const tbb = DB.incomeMonthly - assigned;
      return `
      <div class="grid g21">
        <div class="card">
          <div class="card-hd"><h3>Zero-Based Budget — Every Dollar Has a Job <span class="fr">FR-BUDGET-003</span></h3></div>
          <div class="card-bd">
            <div style="background:${tbb === 0 ? 'rgba(16,185,129,.1)' : 'rgba(245,158,11,.1)'};
                 border:1px solid ${tbb === 0 ? 'rgba(16,185,129,.35)' : 'rgba(245,158,11,.35)'};
                 border-radius:12px;padding:18px;text-align:center;margin-bottom:16px">
              <div style="font-size:11px;color:var(--muted);letter-spacing:.8px;font-weight:700">TO BE BUDGETED</div>
              <div style="font-size:36px;font-weight:800;color:${tbb === 0 ? '#34D399' : '#FBBF24'};margin:5px 0">${money(tbb)}</div>
              <div style="font-size:12.3px;color:var(--txt-2)">
                ${tbb === 0 ? '✓ Every dollar is assigned. You are fully budgeted.' : `${money(tbb)} still needs a job before the month is complete.`}
              </div>
              ${tbb > 0 ? '<button class="btn primary sm" style="margin-top:12px" id="autoAssign">Auto-assign remaining funds</button>' : ''}
            </div>
            <div class="stat-row"><div class="l">Monthly income</div><div class="v">${money(DB.incomeMonthly)}</div></div>
            <div class="stat-row"><div class="l">Total assigned</div><div class="v">${money(assigned)}</div></div>
            <div class="stat-row"><div class="l">Assigned %</div><div class="v">${((assigned / DB.incomeMonthly) * 100).toFixed(1)}%</div></div>
            <div style="margin-top:14px">${progressBar((assigned / DB.incomeMonthly) * 100, 'linear-gradient(90deg,#10B981,#22D3EE)', 'lg')}</div>
          </div>
        </div>
        <div class="card">
          <div class="card-hd"><h3>Assignment by Category</h3></div>
          <div class="card-bd" style="padding-top:6px;max-height:520px;overflow-y:auto">
            ${DB.budget.map(b => `
              <div style="margin-bottom:12px">
                <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
                  <span style="color:var(--txt-2)">${esc(b.cat)}</span>
                  <span style="font-weight:650">${money(b.budgeted)}</span>
                </div>
                ${progressBar((b.budgeted / DB.incomeMonthly) * 100 * 5, '#3B82F6', 'sm')}
              </div>`).join('')}
          </div>
        </div>
      </div>`;
    };

    const renderAdaptiveMethod = () => {
      return `
      <div class="card">
        <div class="card-hd">
          <h3>Adaptive Budget Suggestions <span class="fr">FR-BUDGET-004</span></h3>
          <span class="sub">Based on your trailing 6-month spending average</span>
          <div class="card-tools"><button class="btn primary sm" id="applyAdaptive">Apply all suggestions</button></div>
        </div>
        <div class="card-bd" style="padding-top:6px;overflow-x:auto">
          <table>
            <thead><tr><th>Category</th><th class="num">Current Budget</th><th class="num">6-Mo Average</th><th class="num">Suggested</th><th class="num">Difference</th><th style="width:160px">Variance</th></tr></thead>
            <tbody>
              ${DB.budget.map(b => {
                const sugg = Math.round(b.avg6 / 10) * 10;
                const diff = sugg - b.budgeted;
                const p = Math.min(100, (b.avg6 / Math.max(b.budgeted, sugg)) * 100);
                return `<tr>
                  <td class="t-strong">${esc(b.cat)}</td>
                  <td class="num">${money(b.budgeted)}</td>
                  <td class="num t-muted">${money(b.avg6)}</td>
                  <td class="num" style="color:#60A5FA;font-weight:650">${money(sugg)}</td>
                  <td class="num" style="color:${diff > 0 ? '#F87171' : diff < 0 ? '#34D399' : '#7C8CA8'}">
                    ${diff > 0 ? '+' : ''}${money(diff)}</td>
                  <td>${progressBar(p, diff > 0 ? '#F59E0B' : '#10B981', 'sm')}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card mt">
        <div class="card-hd"><h3>Budget Templates <span class="fr">FR-BUDGET-008</span></h3></div>
        <div class="card-bd">
          <div class="grid g3">
            ${[
              { name: '50 / 30 / 20', desc: 'Needs 50% · Wants 30% · Savings 20%', tags: ['Balanced', 'Classic'] },
              { name: '70 / 20 / 10', desc: 'Living 70% · Savings 20% · Debt 10%', tags: ['Debt focus'] },
              { name: 'Custom ratios', desc: 'Build your own allocation split', tags: ['Advanced'] },
            ].map(t => `
              <div style="background:#0A1224;border:1px solid var(--line);border-radius:11px;padding:15px">
                <div style="font-size:13.5px;font-weight:700;margin-bottom:4px">${t.name}</div>
                <div style="font-size:11.8px;color:var(--muted);margin-bottom:10px">${t.desc}</div>
                <div style="display:flex;gap:5px;margin-bottom:12px">${t.tags.map(x => `<span class="badge grey">${x}</span>`).join('')}</div>
                <button class="btn sm" style="width:100%" onclick="toast('Template applied to your budget')">Apply template</button>
              </div>`).join('')}
          </div>
        </div>
      </div>`;
    };

    renderBody();

    $('#methodSeg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      state.budgetMethod = b.dataset.m;
      $$('#methodSeg button').forEach(x => { x.classList.toggle('on', x === b); x.classList.toggle('accent', x === b); });
      renderBody();
    });

    document.addEventListener('click', e => {
      const f = e.target.closest('[data-focus]');
      if (f) {
        state.focusedView = f.dataset.focus;
        $$('[data-focus]').forEach(x => x.classList.toggle('on', x === f));
        renderBody();
      }
    });
  },
};

            const crossed = [25, 50, 75, 100].find(m => before < m && after >= m);
            if (crossed) { confetti(); toast(`🎉 ${g.name} hit ${crossed}%!`); }

    renderGoals();

          const req = target / months;
          $('#ngCalc').innerHTML = `

            <div class="stat-row"><div class="l">Required monthly contribution</div>
              <div class="v" style="color:#34D399;font-size:15px">${money(req, 2)}</div></div>
            <div class="stat-row"><div class="l">Required weekly contribution</div><div class="v">${money(req / 4.33, 2)}</div></div>`;
        };
        ['ngTarget', 'ngDate'].forEach(id => $('#' + id).addEventListener('input', calc));
        calc();
        root.querySelector('#ngSave').addEventListener('click', () => {
          const name = $('#ngName').value.trim() || 'New Goal';
          const target = +$('#ngTarget').value || 0;
          const date = $('#ngDate').value;
          const months = Math.max(1, monthsUntil(date));
          const colors = ['#10B981', '#3B82F6', '#8B5CF6', '#F59E0B', '#EC4899', '#22D3EE'];
          DB.goals.push({
            id: uid(), name, icon: '🎯', target, saved: 0, date,
            monthly: Math.round(target / months), color: colors[DB.goals.length % colors.length],
            cat: $('#ngCat').value, linked: $('#ngAcct').value, shared: false,
          });
          closeModal(); go('goals');
          toast(`Goal "${name}" created — ${money(target / months, 2)}/mo required`);
        });
      });
    });

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-tmpl]');
      if (!t) return;
      const tmpl = DB.goalTemplates.find(x => x.name === t.dataset.tmpl);

      DB.goals.push({
        id: uid(), name: tmpl.name, icon: tmpl.icon, target: tmpl.amount, saved: 0,

        color: '#22D3EE', cat: tmpl.cat, linked: 'High-Yield Savings', shared: false,
      });
      go('goals');
      toast(`Template "${tmpl.name}" added to your goals`);
    });
  },
};

    const renderTrend = () => {
      const n = ranges[state.creditRange];
      const vals = DB.credit.history12.slice(-n);
      const labels = vals.map((_, i) => {
        const d = addMonths(TODAY, -(vals.length - 1 - i));
        return MONTHS[d.getMonth()];
      });
      chart('creditChart', (ctx, w, h) => {
        drawLine(ctx, w, h, {
          labels,
          series: [{ values: vals, color: '#8B5CF6', fill: true, dots: vals.length <= 6, lastDot: true }],
          fmtY: v => String(Math.round(v)),
        });
      }, 240);
    };

      const b = e.target.closest('button'); if (!b) return;
      state.creditRange = b.dataset.r;
      $$('#creditRange button').forEach(x => { x.classList.toggle('on', x === b); x.classList.toggle('accent', x === b); });
      renderTrend();
    });

    $('#simAction').addEventListener('change', e => {
      $('#simAmtWrap').style.display = e.target.value === 'payoff' ? 'flex' : 'none';
    });

    $('#runSim').addEventListener('click', () => {
      const action = $('#simAction').value;
      const amt = +$('#simAmt').value || 0;
      const base = DB.credit.score;
      let delta = 0, explain = '';

      if (action === 'payoff') {
        const utilDrop = amt / 100000 * 100;
        delta = Math.round(Math.min(22, utilDrop * 1.9));
        explain = `Paying ${money(amt)} toward revolving balances lowers utilization by ${utilDrop.toFixed(1)} percentage points.`;
      } else if (action === 'newcard') {
        delta = -9;
        explain = 'A new account adds a hard inquiry and lowers your average account age.';
      } else if (action === 'close') {
        delta = -21;
        explain = 'Closing your oldest account reduces average credit age and total available credit.';
      } else if (action === 'inquiry') {
        delta = -7;
        explain = 'A mortgage pre-approval triggers one hard inquiry (rate-shopping within 45 days counts once).';
      }

      const projected = clamp(base + delta, 300, 850);
      $('#simResult').innerHTML = `
        <div style="background:#0A1224;border:1px solid ${delta >= 0 ? 'rgba(16,185,129,.35)' : 'rgba(239,68,68,.35)'};border-radius:11px;padding:15px">
          <div style="text-align:center;margin-bottom:12px">
            <div style="font-size:10.5px;color:var(--muted);letter-spacing:.6px">PROJECTED SCORE</div>
            <div style="font-size:34px;font-weight:800;color:${delta >= 0 ? '#34D399' : '#F87171'}">${projected}</div>
            <div style="font-size:12.5px;color:${delta >= 0 ? '#34D399' : '#F87171'};font-weight:650">
              ${delta >= 0 ? '+' : ''}${delta} points</div>
          </div>
          <div style="font-size:11.8px;color:var(--muted);line-height:1.6">${explain}</div>
        </div>`;
      toast('Score simulation complete');
    });
  },
};

          { values: DB.investments.perf12, color: '#10B981', fill: true, lastDot: true },
          { values: DB.investments.benchmark12, color: '#7C8CA8', width: 1.8, dash: [5, 4] },
        ],
        fmtY: v => v.toFixed(0),
      });
    }, 260);

    $$('[data-stress]').forEach(b => b.addEventListener('click', () => {
      const drop = +b.dataset.stress;
      if (drop === 0) { $('#stressResult').innerHTML = ''; toast('Scenario reset'); return; }
      const impact = Math.abs(drop) / 100;
      const newScore = Math.round(DB.investments.readiness - impact * 60);
      const newIncome = Math.round(DB.investments.projectedIncome * (1 - impact * 0.42));
      const loss = Math.round((DB.accounts.brokerage + DB.accounts.k401 + DB.accounts.roth) * impact);
      $('#stressResult').innerHTML = `
        <div class="grid g3">
          <div style="background:#0A1224;border:1px solid rgba(239,68,68,.35);border-radius:11px;padding:14px">
            <div style="font-size:10.5px;color:var(--muted)">PORTFOLIO IMPACT</div>
            <div style="font-size:22px;font-weight:750;color:#F87171;margin-top:4px">−${money(loss)}</div>
          </div>
          <div style="background:#0A1224;border:1px solid rgba(245,158,11,.35);border-radius:11px;padding:14px">
            <div style="font-size:10.5px;color:var(--muted)">READINESS SCORE</div>
            <div style="font-size:22px;font-weight:750;color:#FBBF24;margin-top:4px">${newScore} <span style="font-size:13px;color:var(--muted)">from ${DB.investments.readiness}</span></div>
          </div>
          <div style="background:#0A1224;border:1px solid rgba(245,158,11,.35);border-radius:11px;padding:14px">
            <div style="font-size:10.5px;color:var(--muted)">PROJECTED RETIREMENT INCOME</div>
            <div style="font-size:22px;font-weight:750;color:#FBBF24;margin-top:4px">${money(newIncome)}<span style="font-size:12px;color:var(--muted)">/mo</span></div>
          </div>
        </div>
        <div style="margin-top:12px;padding:12px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:10px;font-size:12.3px;color:var(--txt-2)">
          A ${Math.abs(drop)}% market decline would reduce your portfolio by ${money(loss)}. Your readiness score would fall to
          <b>${newScore}</b>, but historical recoveries average 18–26 months. Maintaining contributions during a downturn
          materially improves long-term outcomes.
        </div>`;
      toast(`Stress test: ${drop}% market decline modelled`, 'warn');
    }));
  },
};

      if (/afford|car payment|can i buy|monthly payment/.test(t)) {
        const m = q.match(/\$?([\d,]+)/);
        const amt = m ? +m[1].replace(/,/g, '') : 500;
        const surplus = DB.incomeMonthly - DB.budget.reduce((s, b) => s + b.budgeted, 0);
        const ok = amt <= surplus + 450;
        return {
          text: `A <b>${money(amt)}/month</b> payment against your current cash flow:
            <br>• Monthly income: <b>${money(DB.incomeMonthly)}</b>
            <br>• Total budgeted outflows: <b>${money(DB.budget.reduce((s, b) => s + b.budgeted, 0))}</b>
            <br>• Unassigned surplus: <b style="color:#34D399">${money(surplus)}</b>
            <br><br>${ok
              ? `✅ <b style="color:#34D399">Yes — this fits.</b> You have ${money(surplus)} unassigned plus the ${money(450)} you currently send as extra debt payment. You'd still keep a ${money(surplus + 450 - amt)} cushion.`
              : `⚠️ <b style="color:#FBBF24">This is tight.</b> It would consume ${((amt / surplus) * 100).toFixed(0)}% of your unassigned surplus and delay your debt-free date.`}
            <br><br><span style="color:var(--muted)">Note: adding a new loan would also extend your combined debt-free date — check the Debt Payoff Planner for the exact impact.</span>`,
          sources: [{ l: 'Income', v: money(DB.incomeMonthly) }, { l: 'Budgeted', v: money(DB.budget.reduce((s, b) => s + b.budgeted, 0)) }],
        };
      }
      // Savings rate
      if (/savings rate|save|saving/.test(t)) {
        const spent = DB.budget.reduce((s, b) => s + b.spent, 0);
        const rate = ((DB.incomeMonthly - spent) / DB.incomeMonthly) * 100;
        return {
          text: `Your savings rate this month is <b style="color:#34D399">${rate.toFixed(1)}%</b>.<br><br>
            Income ${money(DB.incomeMonthly)} − spending ${money(spent)} = <b>${money(DB.incomeMonthly - spent)}</b> saved.
            <br><br>That's well above the 20% benchmark. At this rate you're adding roughly ${money((DB.incomeMonthly - spent) * 12)} to net worth per year.`,
          sources: [{ l: 'Income', v: money(DB.incomeMonthly) }, { l: 'Spending', v: money(spent) }],
        };
      }
      // Debt free
      if (/debt|payoff|pay off|loan|owe/.test(t)) {
        const sim = simulateDebts(DB.debts, state.extra, 'avalanche');
        const base = simulateDebts(DB.debts, 0, 'avalanche');
        return {
          text: `Using the <b>Avalanche</b> strategy with your ${money(state.extra)}/month extra payment, you'll be debt-free in
            <b style="color:#34D399">${debtFreeDate(sim.months)}</b> (${sim.months} months).<br><br>
            • Total interest: <b style="color:#F87171">${money(sim.totalInterest)}</b>
            <br>• Without extra payments: ${base.months} months and ${money(base.totalInterest)} interest
            <br>• Interest saved: <b style="color:#34D399">${money(base.totalInterest - sim.totalInterest)}</b>
            <br><br>Your highest-APR debt is <b>Synchrony Home Improvement at 22%</b> — it's the avalanche priority.`,
          sources: [{ l: 'Total debt', v: money(totalDebtPlanner()) }, { l: 'Strategy', v: 'Avalanche' }, { l: 'Extra/mo', v: money(state.extra) }],
        };
      }
      // Net worth
      if (/net worth|networth|wealth/.test(t)) {
        return {
          text: `Your net worth is <b style="color:#34D399">${money(netWorth())}</b>.<br><br>
            • Assets: ${money(totalAssets())}
            <br>• Liabilities: ${money(totalLiabilities())}
            <br>• Change vs last month: <b style="color:#34D399">+${money(netWorth() - DB.netWorthHistory[DB.netWorthHistory.length - 2])}</b>
            <br>• Year over year: <b style="color:#34D399">+15.9%</b>
            <br><br>Real estate equity is ${money(DB.netWorth.homeValue - DB.netWorth.mortgageBalance)}, representing ${(((DB.netWorth.homeValue - DB.netWorth.mortgageBalance) / netWorth()) * 100).toFixed(0)}% of your total net worth.`,
          sources: [{ l: 'Accounts', v: '11 linked' }, { l: 'Updated', v: 'Today' }],
        };
      }
      // Budget
      if (/budget|overspend|over budget/.test(t)) {
        const over = DB.budget.filter(b => b.spent > b.budgeted);
        return {
          text: `You have <b style="color:#F87171">${over.length} categories over budget</b> this month:<br><br>
            ${over.map(o => `• <b>${esc(o.cat)}</b> — ${money(o.spent)} of ${money(o.budgeted)} (${money(o.spent - o.budgeted)} over)`).join('<br>')}
            <br><br>Combined overspend is ${money(over.reduce((s, o) => s + (o.spent - o.budgeted), 0))}.
            Consider reallocating from <b>Travel</b> (${money(800)} unspent) to cover the gap.`,
          sources: over.map(o => ({ l: o.cat, v: money(o.spent) })),
        };
      }
      // Subscriptions
      if (/subscription|recurring|netflix|spotify/.test(t)) {
        return {
          text: `You have <b>${DB.subscriptions.length} active subscriptions</b> costing <b>${money(subsMonthly(), 2)}/month</b>
            (${money(subsMonthly() * 12, 0)} per year).<br><br>
            🔍 <b>Cancellation candidates:</b><br>
            ${DB.subscriptions.filter(s => s.lastUsed >= 90).map(s => `• ${esc(s.name)} — ${money(s.amount, 2)}/mo, unused ${s.lastUsed} days`).join('<br>') || '• None detected'}
            <br><br>Cancelling both would save <b style="color:#34D399">${money(DB.subscriptions.filter(s => s.lastUsed >= 90).reduce((a, c) => a + c.amount, 0) * 12, 0)}</b> per year.`,
          sources: [{ l: 'Subscriptions', v: DB.subscriptions.length }, { l: 'Monthly', v: money(subsMonthly(), 2) }],
        };
      }
      // Retirement
      if (/retire|401k|ira|pension/.test(t)) {
        return {
          text: `Your retirement readiness score is <b style="color:#34D399">${DB.investments.readiness}/100</b> — on track.<br><br>
            • Projected retirement income: <b>${money(DB.investments.projectedIncome)}/mo</b>
            <br>• Portfolio value: ${money(DB.accounts.k401 + DB.accounts.roth + DB.accounts.brokerage)}
            <br>• Blended expense ratio: ${DB.investments.fees}% (excellent)
            <br>• Concentration flag: AAPL at 11.4% of portfolio
            <br><br>A 20% market decline would lower your score to ~66 but historical recoveries average 18–26 months.`,
          sources: [{ l: 'Score', v: '78/100' }, { l: 'Projected income', v: money(DB.investments.projectedIncome) }],
        };
      }
      // Credit
      if (/credit score|fico|vantage|credit/.test(t)) {
        return {
          text: `Your credit score is <b style="color:#34D399">${DB.credit.score}</b> (${DB.credit.bureau}) — up 6 points in 30 days.<br><br>
            Biggest positive driver: <b>utilization at 8%</b> (down from 12%).
            <br>Watch item: 1 hard inquiry in the last 12 months.
            <br><br>Paying down $2,000 more on your Chase Sapphire card could add roughly <b>+8 points</b>.`,
          sources: [{ l: 'Bureau', v: 'TransUnion' }, { l: 'Updated', v: DB.credit.updated }],
        };
      }
      // Goals
      if (/goal|emergency fund|save for|vacation/.test(t)) {
        const g = DB.goals[0];
        return {
          text: `You have <b>${DB.goals.length} active savings goals</b> totalling ${money(DB.goals.reduce((s, x) => s + x.target, 0))}, with ${money(DB.goals.reduce((s, x) => s + x.saved, 0))} saved so far.<br><br>
            ${DB.goals.map(x => `• <b>${esc(x.name)}</b> — ${((x.saved / x.target) * 100).toFixed(0)}% funded · ${goalPacing(x).label}`).join('<br>')}`,
          sources: DB.goals.slice(0, 3).map(x => ({ l: x.name, v: money(x.saved) })),
        };
      }
      // Cash flow
      if (/cash flow|balance|overdraft|negative/.test(t)) {
        const fc = buildForecast(30, state.scenario);
        const neg = fc.find(f => f.balance < 0);
        const min = Math.min(...fc.map(f => f.balance));
        return {
          text: `Over the next 30 days your lowest projected checking balance is <b style="color:${min < 0 ? '#F87171' : '#34D399'}">${money(min)}</b>.<br><br>
            ${neg
              ? `⚠️ You're projected to go <b style="color:#F87171">negative on ${fmtDateFull(neg.date)}</b> — driven primarily by the Q3 estimated tax payment of ${money(12000)}. A low-balance alert will fire 5 days in advance.`
              : '✅ No negative balance projected in the next 30 days.'}
            <br><br>Your safety buffer is set to ${money(SAFETY_BUFFER)}.`,
          sources: [{ l: 'Checking', v: money(DB.accounts.checking) }, { l: 'Horizon', v: '30 days' }],
        };
      }

      return {
        text: `I can help with spending analysis, debt payoff, budgeting, goals, cash flow, credit health and investments.<br><br>
          Try asking something like <i>"How much did I spend on dining last month?"</i> or
          <i>"When will I be debt-free?"</i><br><br>
          For complex or personalized situations I can connect you with a licensed human advisor.`,
        sources: [],
      };
    };

    const send = (text) => {
      if (!text.trim()) return;
      push('me', esc(text));
      const thinking = document.createElement('div');
      thinking.className = 'msg ai';
      thinking.innerHTML = `<div class="msg-av">✦</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
      body.appendChild(thinking);
      body.scrollTop = body.scrollHeight;

      setTimeout(() => {
        thinking.remove();
        const r = respond(text);
        const srcHtml = r.sources && r.sources.length
          ? `<div class="src"><b>Sources:</b> ${r.sources.map(s => `<span class="src-item">${icon('link', 11)} ${esc(s.l)}: ${esc(s.v)}</span>`).join('')}</div>`
          : '';
        push('ai', r.text + srcHtml + `<div class="disc">Educational information only — not licensed financial advice. Escalate to a human advisor for personalized guidance.</div>`);
      }, 620 + Math.random() * 420);
    };

    $('#chatSend').addEventListener('click', () => {
      const v = $('#chatInput').value;
      $('#chatInput').value = '';
      send(v);
    });
    $('#chatInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') { const v = e.target.value; e.target.value = ''; send(v); }
    });
    $('#chips').addEventListener('click', e => {
      const c = e.target.closest('[data-q]');
      if (c) send(c.dataset.q);
    });
  },
};

function renderNav() {

      <div class="nav-item" data-view="${i.id}">

function go(id) {
  const v = VIEWS[id];
  if (!v) return;
  state.view = id;
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === id));
  $('#pageTitle').textContent = v.title;
  $('#pageSub').textContent = v.sub || '';
  chartRegistry.clear();
  const content = $('#content');
  content.innerHTML = v.render();
  content.scrollTop = 0;
  requestAnimationFrame(() => { try { v.mount && v.mount(); } catch (e) { console.error('mount error', id, e); } });
}

function initSearch() {
  const input = $('#globalSearch');
  const results = $('#searchResults');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { results.classList.remove('show'); return; }
    const matches = SEARCH_INDEX.filter(x => (x.t + x.d).toLowerCase().includes(q)).slice(0, 6);
    if (!matches.length) { results.classList.remove('show'); return; }
    results.innerHTML = matches.map(m => `
      <div class="sr-item" data-go="${m.v}">
        ${icon(m.i, 15)}<div><div style="color:var(--txt)">${esc(m.t)}</div>
        <div style="font-size:10.5px;color:var(--muted)">${esc(m.d)}</div></div>
      </div>`).join('');
    results.classList.add('show');
    $$('.sr-item', results).forEach(el => el.addEventListener('click', () => {
      go(el.dataset.go);
      input.value = '';
      results.classList.remove('show');
    }));
  });
  input.addEventListener('blur', () => setTimeout(() => results.classList.remove('show'), 180));
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault(); input.focus();
    }
  });
}

        <div class="dd-s">${esc(n.s)}</div>
        <div class="dd-s" style="color:var(--dim);margin-top:3px">${n.when}</div>
      </div>
    </div>`).join('') + `
    <div class="dd-item" style="justify-content:center;color:var(--accent);font-weight:600;font-size:12.5px"
         onclick="go('settings');document.getElementById('notifDD').classList.remove('show')">
      Manage notification settings →
    </div>`;

  $('#bellBtn').addEventListener('click', e => {
    e.stopPropagation();
    $('#notifDD').classList.toggle('show');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#notifDD') && !e.target.closest('#bellBtn')) {
      $('#notifDD').classList.remove('show');
    }
  });
}
